# Publishes the JavaScript and Python packages when a release tag is pushed
# (v0.1.0, v0.2.0, …). Go needs no registry: `go get` reads the tag go/v0.1.0
# straight from this repository.
#
# Credentials live in the repository's Actions secrets (NPM_TOKEN, PYPI_TOKEN),
# never in the tree. Both jobs run the tests again before publishing.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: node --test
        working-directory: javascript
      - run: npm publish --provenance --access public
        working-directory: javascript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
        working-directory: python
      - run: python -m pip install --upgrade build && python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          password: ${{ secrets.PYPI_TOKEN }}
