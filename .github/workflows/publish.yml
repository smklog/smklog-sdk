# Publishes the JavaScript and Python packages when a release tag is pushed
# (v0.1.0, v0.2.0, …). Go needs no registry: `go get` reads the tag go/v0.1.0
# straight from this repository.
#
# No long-lived secrets. Both registries trust this workflow through OpenID
# Connect ("trusted publishing"): npm is told that smklog-sdk/publish.yml may
# publish the package `smklog`, PyPI that it may publish `smklog-sdk`. Until that
# trust is configured on each registry, the job fails at the publish step and
# nothing else happens.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: node --test
        working-directory: javascript
      - run: npm publish --provenance --access public
        working-directory: javascript

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
        working-directory: python
      - run: python -m pip install --upgrade build && python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
